services:
  - type: web
    name: secret-chat
    runtime: node
    plan: free
    # --include=dev es obligatorio: Render fija NODE_ENV=production también en el
    # build y npm omite devDependencies (fallaría tsc y @types/express).
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
